name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual smoke-test of the release build without cutting a tag/release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags: versionName/versionCode derive from git describe.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default ('tools platform-tools') installs the legacy
          # 'tools' package, which Google removed from the SDK repository
          # (sdkmanager: "Warning: Failed to find package 'tools'"). The
          # hosted runner already ships platform-tools and AGP downloads the
          # exact platform/build-tools it needs, so install nothing extra.
          packages: ''

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Build release APK
        env:
          LEVEL2_RELEASE_STORE_FILE: /tmp/release.jks
          LEVEL2_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LEVEL2_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LEVEL2_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease

      - name: Create GitHub Release
        # Only on tag pushes; workflow_dispatch runs build the APK without
        # publishing a release.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --generate-notes \
            android/app/build/outputs/apk/release/app-release.apk
