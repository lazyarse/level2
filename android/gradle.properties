# Capped for a 15 GiB host shared with emulator/browser: the 8G ceiling let a
# long-lived daemon balloon past 5 GB RSS and wedge. Debug assembles and both
# 801-test unit suites fit comfortably under 4G.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0